[workspace]
members = [
    "src/engine",
    "src/harts",
    "src/memory",
    "src/core",
    "src/tests",
    "src/journal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
license-file = "LICENSE"
authors = [
    "Antônio Drumond Cota de Souza", 
    "Davi Ferreira Puddo", 
    "Mateus Henrique Medeiros Diniz"
]
edition = "2024"
homepage = "https://github.com/cart-pucminas/narvi"

[workspace.dependencies]
core = { path = "src/core" }
engine = { path = "src/engine" }
harts = { path = "src/harts" }
journal = { path = "src/journal" }
memory = { path = "src/memory" }
tests = { path = "src/tests" }
rounding_mode = { git = "https://github.com/AntonioDrumond/rust-rounding-mode", rev = "b4bfeafe1dcfcaf527b7faa48b31070f6a414822" }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
rand = "0.10.2"
